deck_id: "deck_1"
name: "USCSS Morrigan - Main Deck"
location_name: "USCSS Morrigan"
description: "Main deck layout - central corridor with bridge, crew and medical above; engineering, cargo and airlock below"
unit_size: 40

rooms:
  # === UPPER ROOMS (above main corridor) ===

  - id: bridge
    name: "BRIDGE"
    rects:
      - {x: 1, y: 0, w: 5, h: 3}
    doors:
      - {wall: south, position: 2, type: blast_door, status: CLOSED}
    description: "Primary flight control and navigation center"
    type: bridge

  - id: crew_quarters
    name: "CREW QUARTERS"
    rects:
      - {x: 8, y: 0, w: 5, h: 3}
    doors:
      - {wall: south, position: 2, type: standard, status: OPEN}
    description: "Crew sleeping pods and personal storage"
    type: crew

  - id: medical
    name: "MEDICAL BAY"
    rects:
      - {x: 15, y: 0, w: 5, h: 3}
    doors:
      - {wall: south, position: 2, type: standard, status: CLOSED}
    description: "Medical treatment and quarantine facility"
    type: medical

  # === MAIN CORRIDOR ===

  - id: main_corridor
    name: ""
    rects:
      - {x: 0, y: 3, w: 20, h: 2}
    type: corridor

  # === LOWER ROOMS (below main corridor) ===

  - id: engineering
    name: "ENGINEERING"
    rects:
      - {x: 0, y: 5, w: 5, h: 4}
    doors:
      - {wall: north, position: 2, type: blast_door, status: CLOSED}
      - {wall: south, position: 2, type: emergency, status: LOCKED}
    description: "Main reactor and engine systems"
    type: engineering

  - id: cargo_bay
    name: "CARGO BAY"
    rects:
      - {x: 6, y: 5, w: 7, h: 4}
    doors:
      - {wall: north, position: 3, type: standard, status: OPEN}
      - {wall: east, position: 1, type: airlock, status: SEALED}
    description: "Primary cargo storage area"
    type: cargo

  - id: airlock_bay
    name: "AIRLOCK BAY"
    rects:
      - {x: 14, y: 5, w: 5, h: 4}
    doors:
      - {wall: north, position: 2, type: airlock, status: SEALED}
    description: "EVA preparation and external access"
    type: airlock

  # === LOWER EXTENSION ===

  - id: life_support
    name: "LIFE SUPPORT"
    rects:
      - {x: 0, y: 9, w: 5, h: 3}
    doors:
      - {wall: north, position: 2, type: emergency, status: LOCKED}
    description: "Atmospheric recycling and water reclamation"
    type: life_support

terminals:
  - id: bridge_nav
    room: bridge
    position:
      x: 3.5
      y: 1.5
    terminal_slug: "nav-console"
    name: "NAV CONSOLE"

  - id: bridge_comm
    room: bridge
    position:
      x: 4.5
      y: 1.5
    terminal_slug: "comm-console"
    name: "COMM CONSOLE"

  - id: eng_reactor
    room: engineering
    position:
      x: 2.5
      y: 7.5
    terminal_slug: "reactor-control"
    name: "REACTOR CONTROL"

  - id: med_terminal
    room: medical
    position:
      x: 17.0
      y: 1.5
    terminal_slug: "medical-console"
    name: "MEDICAL CONSOLE"

  - id: cargo_manifest
    room: cargo_bay
    position:
      x: 9.5
      y: 7.5
    terminal_slug: "cargo-manifest"
    name: "CARGO MANIFEST"

  - id: life_support_console
    room: life_support
    position:
      x: 2.5
      y: 10.5
    terminal_slug: "life-support-console"
    name: "LIFE SUPPORT CONSOLE"

poi:
  - id: escape_pod_1
    type: "objective"
    room: airlock_bay
    position:
      x: 16.5
      y: 6.5
    name: "ESCAPE POD A"
    icon: "pod"
    status: "READY"
    description: "Emergency escape pod (4 person capacity)"

  - id: escape_pod_2
    type: "objective"
    room: airlock_bay
    position:
      x: 16.5
      y: 8.0
    name: "ESCAPE POD B"
    icon: "pod"
    status: "READY"
    description: "Emergency escape pod (4 person capacity)"

  - id: breach_site
    type: "hazard"
    room: cargo_bay
    position:
      x: 11.5
      y: 8.5
    name: "HULL BREACH"
    icon: "warning"
    status: "CRITICAL"
    description: "Structural damage - depressurization risk"

  - id: supply_cache
    type: "item"
    room: cargo_bay
    position:
      x: 7.5
      y: 7.0
    name: "SUPPLY CRATE"
    icon: "crate"
    description: "Medical supplies and rations"

  - id: reactor_core
    type: "hazard"
    room: engineering
    position:
      x: 2.5
      y: 6.5
    name: "REACTOR CORE"
    icon: "warning"
    status: "WARNING"
    description: "Elevated radiation levels - protective gear required"

metadata:
  author: "GM"
  created: "2183-06-15"
  version: 3
  tags: ["ship", "exploration", "combat"]
