name: "USCSS Morrigan - Main Deck"
deck_id: "deck_1"
location_name: "USCSS Morrigan"
description: "Main deck layout — bridge, crew quarters, medical, engineering, cargo, airlock"
unit_size: 40

# Grid-format map: rooms defined as rects with optional chamfer for
# diagonal corner cuts (octagonal rooms). Corridors are unnamed rooms
# connecting larger spaces. Doors sit on wall edges, position is the
# 0-based index along the non-chamfered cells of that wall.

rooms:
  # =================================================================
  # MAIN ROOMS — chamfered octagonal shape (chamfer: 1)
  # =================================================================

  - id: bridge
    name: "BRIDGE"
    description: "Primary flight control and navigation center"
    type: bridge
    rects:
      - {x: 1, y: 1, w: 5, h: 4, chamfer: 1}
    doors:
      # East wall: valid rows 2-3 (chamfer removes rows 1,4). position 0 → row 2
      - {wall: east, position: 0, type: standard, status: OPEN}
      # South wall: valid cols 2-4. position 1 → col 3 (center)
      - {wall: south, position: 1, type: blast_door, status: CLOSED}

  - id: crew_quarters
    name: "CREW QUARTERS"
    description: "Crew sleeping pods and personal storage"
    rects:
      - {x: 8, y: 1, w: 6, h: 4, chamfer: 1}
    doors:
      # West wall: valid rows 2-3. position 0 → row 2
      - {wall: west, position: 0, type: standard, status: OPEN}
      # East wall: valid rows 2-3. position 0 → row 2
      - {wall: east, position: 0, type: standard, status: CLOSED}

  - id: medical
    name: "MEDICAL BAY"
    description: "Medical treatment and quarantine facility"
    rects:
      - {x: 16, y: 1, w: 5, h: 4, chamfer: 1}
    doors:
      # West wall: valid rows 2-3. position 0 → row 2
      - {wall: west, position: 0, type: standard, status: CLOSED}

  - id: engineering
    name: "ENGINEERING"
    description: "Main reactor and engine systems"
    type: engineering
    rects:
      - {x: 1, y: 7, w: 5, h: 5, chamfer: 1}
    doors:
      # North wall: valid cols 2-4. position 1 → col 3 (aligns with bridge south)
      - {wall: north, position: 1, type: blast_door, status: CLOSED}
      # East wall: valid rows 8-10. position 1 → row 9 (center)
      - {wall: east, position: 1, type: standard, status: OPEN}
      # South wall: valid cols 2-4. position 1 → col 3
      - {wall: south, position: 1, type: emergency, status: LOCKED}

  - id: cargo_bay
    name: "CARGO BAY"
    description: "Primary cargo storage area"
    type: cargo
    rects:
      - {x: 8, y: 7, w: 7, h: 5, chamfer: 1}
    doors:
      # West wall: valid rows 8-10. position 1 → row 9
      - {wall: west, position: 1, type: standard, status: OPEN}
      # East wall: valid rows 8-10. position 1 → row 9
      - {wall: east, position: 1, type: standard, status: CLOSED}

  - id: airlock
    name: "AIRLOCK BAY"
    description: "EVA preparation and external access"
    type: airlock
    rects:
      - {x: 17, y: 7, w: 5, h: 5, chamfer: 1}
    doors:
      # West wall: valid rows 8-10. position 1 → row 9 (aligns with cargo east)
      - {wall: west, position: 1, type: airlock, status: SEALED}

  - id: life_support
    name: "LIFE SUPPORT"
    description: "Atmospheric recycling and water reclamation"
    rects:
      - {x: 1, y: 14, w: 5, h: 3, chamfer: 1}
    doors:
      # North wall: valid cols 2-4. position 1 → col 3 (aligns with eng south)
      - {wall: north, position: 1, type: emergency, status: LOCKED}

  # =================================================================
  # CORRIDORS — plain rectangles (no chamfer), no label
  # =================================================================

  # Bridge (east) ↔ Crew Quarters (west)
  - id: c_bridge_crew
    name: ""
    type: corridor
    rects:
      - {x: 6, y: 2, w: 2, h: 2}

  # Crew Quarters (east) ↔ Medical Bay (west)
  - id: c_crew_med
    name: ""
    type: corridor
    rects:
      - {x: 14, y: 2, w: 2, h: 2}

  # Bridge (south) ↔ Engineering (north) — fills the 2-row gap
  - id: c_bridge_eng
    name: ""
    type: corridor
    rects:
      - {x: 2, y: 5, w: 3, h: 2}

  # Engineering (east) ↔ Cargo Bay (west)
  - id: c_eng_cargo
    name: ""
    type: corridor
    rects:
      - {x: 6, y: 8, w: 2, h: 3}

  # Cargo Bay (east) ↔ Airlock (west)
  - id: c_cargo_airlock
    name: ""
    type: corridor
    rects:
      - {x: 15, y: 8, w: 2, h: 3}

  # Engineering (south) ↔ Life Support (north) — fills the 1-row gap
  - id: c_eng_life
    name: ""
    type: corridor
    rects:
      - {x: 2, y: 12, w: 3, h: 2}

poi:
  - id: reactor_core
    type: hazard
    room: engineering
    position: {x: 3.5, y: 9.5}
    name: "REACTOR CORE"
    icon: "reactor core"
    status: "WARNING"
    description: "Elevated radiation levels — protective gear required"

  - id: breach_site
    type: hazard
    room: cargo_bay
    position: {x: 13, y: 10.5}
    name: "HULL BREACH"
    icon: "warning"
    status: "CRITICAL"
    description: "Structural damage — depressurization risk"

  - id: escape_pod_a
    type: objective
    room: airlock
    position: {x: 19, y: 9}
    name: "ESCAPE POD A"
    icon: "emergency capsule"
    status: "READY"
    description: "Emergency escape pod (4 person capacity)"

  - id: supply_cache
    type: item
    room: cargo_bay
    position: {x: 10, y: 9}
    name: "SUPPLY CRATE"
    icon: "crate"
    description: "Medical supplies and rations"

metadata:
  author: "GM"
  created: "2183-06-15"
  version: 3
  tags: ["ship", "grid", "chamfered"]
