deck_id: "deck_2"
name: "USCSS Morrigan - Lower Deck"
location_name: "USCSS Morrigan"
description: "Lower deck - central corridor with maintenance and storage above; fuel cells and waste processing below"
unit_size: 40

rooms:
  # === UPPER ROOMS (above lower corridor) ===

  - id: maintenance
    name: "MAINTENANCE"
    rects:
      - {x: 0, y: 0, w: 5, h: 4}
    doors:
      - {wall: south, position: 2, type: standard, status: OPEN}
    description: "Ship maintenance and repair bay"
    type: engineering

  - id: storage_a
    name: "STORAGE A"
    rects:
      - {x: 7, y: 0, w: 5, h: 4}
    doors:
      - {wall: south, position: 2, type: standard, status: OPEN}
      - {wall: east, position: 1, type: standard, status: LOCKED}
    description: "General storage compartment"
    type: cargo

  - id: storage_b
    name: "STORAGE B"
    rects:
      - {x: 14, y: 0, w: 5, h: 4}
    doors:
      - {wall: south, position: 2, type: standard, status: LOCKED}
    description: "Secure storage compartment"
    type: cargo

  # === LOWER CORRIDOR ===

  - id: lower_corridor
    name: ""
    rects:
      - {x: 0, y: 4, w: 20, h: 2}
    type: corridor

  # === LOWER ROOMS (below lower corridor) ===

  - id: fuel_cells
    name: "FUEL CELLS"
    rects:
      - {x: 0, y: 6, w: 5, h: 3}
    doors:
      - {wall: north, position: 2, type: emergency, status: CLOSED}
    description: "Fuel cell storage and management"
    type: engineering

  - id: waste_processing
    name: "WASTE PROC"
    rects:
      - {x: 6, y: 6, w: 7, h: 3}
    doors:
      - {wall: north, position: 3, type: standard, status: OPEN}
    description: "Waste processing and recycling"
    type: utility

terminals:
  - id: maint_console
    room: maintenance
    position:
      x: 2.5
      y: 2.0
    terminal_slug: "maintenance-console"
    name: "MAINT CONSOLE"

  - id: fuel_monitor
    room: fuel_cells
    position:
      x: 2.5
      y: 7.5
    terminal_slug: "fuel-monitor"
    name: "FUEL MONITOR"

poi:
  - id: hidden_cache
    type: "item"
    room: storage_b
    position:
      x: 16.0
      y: 2.0
    name: "HIDDEN CACHE"
    icon: "crate"
    description: "Concealed storage compartment"

  - id: fuel_leak
    type: "hazard"
    room: fuel_cells
    position:
      x: 3.0
      y: 8.0
    name: "FUEL LEAK"
    icon: "warning"
    status: "WARNING"
    description: "Minor fuel leak detected - flammable atmosphere"

metadata:
  author: "GM"
  created: "2183-06-15"
  version: 2
  tags: ["ship", "exploration"]
