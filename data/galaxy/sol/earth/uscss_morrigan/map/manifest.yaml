# Multi-deck manifest for USCSS Morrigan
# Defines all available decks and their map files

name: "USCSS Morrigan"
facility_type: "ship"
total_decks: 2

# Hull polygon defines the outer frame of the ship (grid cell coords).
# Defined here at the manifest level so the same silhouette appears on every deck.
# Rooms on each deck render as negative space (lighter floor color) within this shape.
hull:
  polygon:
    - [-1.5, 1.5]   # fore-port bow
    - [0,    -1.0]  # fore-starboard bow
    - [20,   -1.0]  # upper main body
    - [25.5,  0.5]  # upper junction protrusion
    - [31.5,  6.0]  # aft tip
    - [29.5, 11.5]  # aft lower
    - [19.0, 13.5]  # lower main body — starboard
    - [0,    13.5]  # lower main body — port
    - [-1.5, 10.5]  # fore-port keel

decks:
  - id: "deck_1"
    name: "Main Deck"
    file: "deck_1.yaml"
    level: 1
    default: true
    description: "Primary operations - bridge, crew quarters, medical, engineering"

  - id: "deck_2"
    name: "Lower Deck"
    file: "deck_2.yaml"
    level: 2
    description: "Storage, maintenance, and secondary systems"
